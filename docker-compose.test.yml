# ====== Test Compose (The "Lab") ======
# Use this for running automated tests.
# - Isolation: Uses a separate database (food_delivery_test) to avoid messing with dev data.
# - Automated: Services are configured to run test suites (npm test) and then shut down.
# - Non-conflicting: Uses different ports so it can run alongside the development environment.
# Run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit

name: food-delivery-test

services:
  postgres:
    build: ./database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Use a separate database so test data doesn't pollute dev
      POSTGRES_DB: food_delivery_test
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    ports:
      - '5442:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - food_net_test

  user-service:
    build:
      context: ./services/user-service
      args:
        - NODE_ENV=development
    command: npm test
    environment:
      PORT: 4001
      NODE_ENV: test
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: food_delivery_test
      JWT_SECRET: ${JWT_SECRET:-test-jwt-secret}
    ports:
      - '4001:4001'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - food_net_test

  restaurant-service:
    build:
      context: ./services/restaurant-service
      args:
        - NODE_ENV=development
    command: npm test
    environment:
      PORT: 4002
      NODE_ENV: test
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: food_delivery_test
    ports:
      - '4002:4002'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - food_net_test

  order-service:
    build:
      context: ./services/order-service
      args:
        - NODE_ENV=development
    command: npm test
    environment:
      PORT: 4003
      NODE_ENV: test
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: food_delivery_test
      USER_SERVICE_URL: http://user-service:4001
      RESTAURANT_SERVICE_URL: http://restaurant-service:4002
      PAYMENT_SERVICE_URL: http://payment-service:4004
    ports:
      - '4003:4003'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - food_net_test

  payment-service:
    build:
      context: ./services/payment-service
      args:
        - NODE_ENV=development
    command: npm test
    environment:
      PORT: 4004
      NODE_ENV: test
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: food_delivery_test
    ports:
      - '4004:4004'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - food_net_test


volumes:
  pgdata_test:

networks:
  food_net_test:
    driver: bridge
