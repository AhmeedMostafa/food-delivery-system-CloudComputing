# ====== 08-order-deployment.yaml ======
# 2 replicas of order-service.
# Apply: kubectl apply -f k8s/08-order-deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: food-delivery/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: food-config
          env:
            - name: PORT
              value: "3003"
