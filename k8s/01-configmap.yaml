# ====== 01-configmap.yaml ======
# Creates two ConfigMaps:
#   food-config        -- shared env vars for all backend services
#   postgres-init-sql  -- the init.sql mounted into postgres on first start
#
# Apply: kubectl apply -f k8s/01-configmap.yaml
#
# Note: in production, sensitive values like DB_PASSWORD and JWT_SECRET
# should be in a Kubernetes Secret. Combined here for demo simplicity.

apiVersion: v1
kind: ConfigMap
metadata:
  name: food-config
data:
  DB_HOST: postgres-service
  DB_PORT: "5432"
  DB_USER: postgres
  DB_NAME: food_delivery
  USER_SERVICE_URL: http://user-service:3001
  RESTAURANT_SERVICE_URL: http://restaurant-service:3002
  PAYMENT_SERVICE_URL: http://payment-service:3004
  NODE_ENV: production
---
# Second ConfigMap: embeds init.sql so postgres runs it on first start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
data:
  init.sql: |
    -- ============================================================
    -- Food Delivery System -- Database Initialization
    -- Runs automatically when the postgres container first starts.
    -- Creates 4 schemas (one per microservice) + seeds sample data.
    -- ============================================================

    -- ====== Schemas ======
    CREATE SCHEMA IF NOT EXISTS user_svc;
    CREATE SCHEMA IF NOT EXISTS restaurant_svc;
    CREATE SCHEMA IF NOT EXISTS order_svc;
    CREATE SCHEMA IF NOT EXISTS payment_svc;

    -- ====== user_svc tables ======
    CREATE TABLE IF NOT EXISTS user_svc.users (
      id            SERIAL PRIMARY KEY,
      name          VARCHAR(100) NOT NULL,
      email         VARCHAR(255) NOT NULL UNIQUE,
      password      TEXT NOT NULL,
      phone         VARCHAR(20),
      address       TEXT,
      role          VARCHAR(30) NOT NULL DEFAULT 'customer',
      restaurant_id INTEGER,
      created_at    TIMESTAMPTZ DEFAULT NOW()
    );

    -- ====== restaurant_svc tables ======
    CREATE TABLE IF NOT EXISTS restaurant_svc.restaurants (
      id          SERIAL PRIMARY KEY,
      name        VARCHAR(150) NOT NULL,
      cuisine     VARCHAR(100),
      address     TEXT,
      image_url   TEXT,
      rating      NUMERIC(2,1) DEFAULT 4.0,
      created_at  TIMESTAMPTZ DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS restaurant_svc.menu_items (
      id              SERIAL PRIMARY KEY,
      restaurant_id   INTEGER NOT NULL REFERENCES restaurant_svc.restaurants(id) ON DELETE CASCADE,
      name            VARCHAR(150) NOT NULL,
      description     TEXT,
      price           NUMERIC(10,2) NOT NULL,
      image_url       TEXT,
      is_available    BOOLEAN DEFAULT TRUE,
      created_at      TIMESTAMPTZ DEFAULT NOW()
    );

    -- ====== order_svc tables ======
    CREATE TABLE IF NOT EXISTS order_svc.orders (
      id               SERIAL PRIMARY KEY,
      user_id          INTEGER NOT NULL,
      restaurant_id    INTEGER NOT NULL,
      status           VARCHAR(30) NOT NULL DEFAULT 'PLACED',
      total_price      NUMERIC(10,2) NOT NULL,
      delivery_address TEXT,
      driver_id        INTEGER,
      created_at       TIMESTAMPTZ DEFAULT NOW(),
      updated_at       TIMESTAMPTZ DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS order_svc.order_items (
      id            SERIAL PRIMARY KEY,
      order_id      INTEGER NOT NULL REFERENCES order_svc.orders(id) ON DELETE CASCADE,
      menu_item_id  INTEGER NOT NULL,
      name          VARCHAR(150) NOT NULL,
      price         NUMERIC(10,2) NOT NULL,
      qty           INTEGER NOT NULL CHECK (qty > 0)
    );

    -- ====== payment_svc tables ======
    CREATE TABLE IF NOT EXISTS payment_svc.transactions (
      id         SERIAL PRIMARY KEY,
      order_id   INTEGER NOT NULL,
      user_id    INTEGER NOT NULL,
      amount     NUMERIC(10,2) NOT NULL,
      method     VARCHAR(30) NOT NULL DEFAULT 'CREDIT_CARD',
      status     VARCHAR(30) NOT NULL DEFAULT 'PENDING',
      created_at TIMESTAMPTZ DEFAULT NOW()
    );

