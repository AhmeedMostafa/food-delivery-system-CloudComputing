# ====== 12-payment-deployment.yaml ======
# Deploys the payment-service (port 3004).
# Reads DB connection + other config from the food-config ConfigMap.
# Uses imagePullPolicy: IfNotPresent because the image is built locally via minikube.
#
# Apply: kubectl apply -f k8s/12-payment-deployment.yaml

# ==========================================
# API Version and Kind define what type of Kubernetes resource this is.
apiVersion: apps/v1
kind: Deployment
# Metadata stores identification info (name and labels) used for internal lookup.
metadata:
  name: payment-service
  labels:
    app: payment-service
# SPEC (Specification) describes exactly how you want this item to behave.
spec:
  # REPLICAS: The exact count of Pod instances you want running in Parallel.
  replicas: 2
  # SELECTOR: The 'lookup logic' that connects this manager to the actual Pods.
  selector:
    matchLabels:
      app: payment-service
  # TEMPLATE: The blueprint/cookie-cutter used to generate new Pod clones.
  template:
    metadata:
      labels:
        app: payment-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3004"
    # The pod specification, explaining the exact settings of the microservice containers.
    spec:
      # CONTAINERS: Definition of the actual Docker workloads executing inside.
      containers:
        - name: payment-service
          # The external image to download from Docker registry.
          image: food-delivery/payment-service:latest
          imagePullPolicy: IfNotPresent
          # Network interface linking virtual Cluster ports to internal container ports.
          ports:
            - containerPort: 3004
          # Bulk loads ALL variables defined inside a central ConfigMap or Secret.
          envFrom:
            - configMapRef:
                name: food-config
            - secretRef:
                name: food-secrets
          # Dynamic Environment Variables loaded uniquely for this run.
          env:
            - name: PORT
              value: "3004"
          # Compute quotas enforced to prevent CPU/Memory throttling and crashes.
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          # Quick health check so K8s knows when the container is ready
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 20