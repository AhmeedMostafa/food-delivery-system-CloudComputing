# ====== 06-restaurant-deployment.yaml ======
# 2 replicas of restaurant-service.
# Apply: kubectl apply -f k8s/06-restaurant-deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: restaurant-service
  template:
    metadata:
      labels:
        app: restaurant-service
    spec:
      containers:
        - name: restaurant-service
          image: food-delivery/restaurant-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: food-config
          env:
            - name: PORT
              value: "3002"
