# ====== 24-loki.yaml ======
# Loki log aggregation server — stores all pod logs persistently.
#
# Apply: kubectl apply -f k8s/24-loki.yaml
---
# ==========================================
# API Version and Kind define what type of Kubernetes resource this is.
apiVersion: v1
kind: ConfigMap
# Metadata stores identification info (name and labels) used for internal lookup.
metadata:
  name: loki-config
  namespace: default
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
    compactor:
      working_directory: /loki/compactor
---
# ==========================================
# API Version and Kind define what type of Kubernetes resource this is.
apiVersion: apps/v1
kind: StatefulSet
# Metadata stores identification info (name and labels) used for internal lookup.
metadata:
  name: loki
  namespace: default
# SPEC (Specification) describes exactly how you want this item to behave.
spec:
  serviceName: loki
  # REPLICAS: The exact count of Pod instances you want running in Parallel.
  replicas: 1
  selector:
    # Finds targets based on matching the 'Key: Value' tags.
    matchLabels:
      app: loki
  # TEMPLATE: The blueprint/cookie-cutter used to generate new Pod clones.
  template:
    metadata:
      labels:
        app: loki
    # The pod specification, explaining the exact settings of the microservice containers.
    spec:
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
      # CONTAINERS: Definition of the actual Docker workloads executing inside.
      containers:
      - name: loki
        # The external image to download from Docker registry.
        image: grafana/loki:2.9.4
        args:
        - -config.file=/etc/loki/loki.yaml
        # Networking ports that are OPEN and listening on the application.
        ports:
        - containerPort: 3100
          name: http
        # Physically maps a virtual storage volume onto a real folder path in code.
        volumeMounts:
        - name: loki-config
          mountPath: /etc/loki
        - name: loki-data
          mountPath: /loki
        # Compute quotas enforced to prevent CPU/Memory throttling and crashes.
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 30
          periodSeconds: 20
      # External volume sources (ConfigMaps, Disks) that can be consumed above.
      volumes:
      - name: loki-config
        configMap:
          name: loki-config
  # DYNAMIC STORAGE: Requests physical Cloud hard drive dynamically attached here.
  volumeClaimTemplates:
  - metadata:
      name: loki-data
    # The pod specification, explaining the exact settings of the microservice containers.
    spec:
      accessModes: ["ReadWriteOnce"]
      # Compute quotas enforced to prevent CPU/Memory throttling and crashes.
      resources:
        requests:
          storage: 5Gi
---
# ==========================================
# API Version and Kind define what type of Kubernetes resource this is.
apiVersion: v1
kind: Service
# Metadata stores identification info (name and labels) used for internal lookup.
metadata:
  name: loki
  namespace: default
  labels:
    app: loki
# SPEC (Specification) describes exactly how you want this item to behave.
spec:
  selector:
    app: loki
  # Network interface linking virtual Cluster ports to internal container ports.
  ports:
  - port: 3100
    targetPort: 3100
    name: http