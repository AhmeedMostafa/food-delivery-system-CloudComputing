# ====== 07-restaurant-service.yaml ======
# ClusterIP service for restaurant-service.
# Apply: kubectl apply -f k8s/07-restaurant-service.yaml

# ==========================================
# API Version and Kind define what type of Kubernetes resource this is.
apiVersion: v1
kind: Service
# Metadata stores identification info (name and labels) used for internal lookup.
metadata:
  name: restaurant-service
# SPEC (Specification) describes exactly how you want this item to behave.
spec:
  selector:
    app: restaurant-service
  # Network interface linking virtual Cluster ports to internal container ports.
  ports:
    - protocol: TCP
      port: 3002
      targetPort: 3002
  # CLUSTERIP: Standard default service. Hidden from web, only visible internal to K8s!
  type: ClusterIP