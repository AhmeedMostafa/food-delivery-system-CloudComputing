# ====== 05-user-service.yaml ======
# ClusterIP service for user-service.
# Apply: kubectl apply -f k8s/05-user-service.yaml

apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
  type: ClusterIP
