# ====== 04-user-deployment.yaml ======
# 2 replicas of user-service. Image built locally via:
#   eval $(minikube docker-env)
#   docker build -t food-delivery/user-service:latest ./services/user-service
# Apply: kubectl apply -f k8s/04-user-deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: food-delivery/user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: food-config
          env:
            - name: PORT
              value: "3001"
